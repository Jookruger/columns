<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller DTI UACh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8fd; --card:#ffffff; --line:#e4e9f4; --line2:#dbe2f1;
    --txt:#1b2244; --mut:#68729a; --accentV:#12b3a3;
    --A:#2f6bff; --Afill:rgba(47,107,255,.20);
    --B:#ff4d6d; --Bfill:rgba(255,77,109,.18);
    --ok:#18b866; --warn:#f5a623; --ink:#141a33;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(1100px 620px at 50% -12%,#e9f0ff,#f6f8fd 62%);color:var(--txt);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  h1,h2,h3{margin:0 0 .2em;font-family:"Poppins","Inter",sans-serif}
  .mut{color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 12px 40px rgba(31,49,102,.08)}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:700;
    background:var(--A);color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.28);
    transition:transform .05s ease,filter .15s}
  button:hover{filter:brightness(1.05)}
  button:active{transform:translateY(1px)}
  button.ghost{background:#eef2fb;color:var(--txt);border:1px solid var(--line2);box-shadow:none}
  button.big{padding:16px 26px;font-size:1.1rem;border-radius:14px}
  button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  input,textarea{font:inherit;background:#fff;border:1px solid var(--line2);color:var(--txt);
    border-radius:10px;padding:10px 12px;width:100%}
  textarea{min-height:210px;line-height:1.5;resize:vertical}
  label.fld{display:block;margin:12px 0 6px;font-weight:600;color:var(--mut);font-size:.9rem}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);
    border-radius:999px;padding:8px 14px;font-weight:600;box-shadow:0 2px 8px rgba(31,49,102,.05)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(24,184,102,.15)}
  .dot.off{background:var(--warn);box-shadow:0 0 0 4px rgba(245,166,35,.18)}
  /* marca */
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:42px;height:42px;flex:none}
  .brand .name{font-family:"Poppins",sans-serif;font-weight:800;font-size:1.2rem;line-height:1.05;letter-spacing:.2px;color:var(--ink)}
  .brand .name small{display:block;font-weight:600;color:var(--mut);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
  .foot{text-align:center;color:var(--mut);font-size:.8rem;margin:22px 0 8px;letter-spacing:.02em}
  .foot b{color:var(--txt);font-weight:700}
  .topbar{display:flex;align-items:center;gap:12px;padding:2px 2px 4px}
  /* chips (selección) */
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .chip{user-select:none;background:#fff;border:1.5px solid var(--line2);border-radius:14px;
    padding:12px 15px;font-weight:600;display:flex;align-items:center;gap:9px;flex:1 1 46%;min-width:0;
    transition:border-color .12s,background .12s}
  .chip .n{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);flex:none;
    display:grid;place-items:center;font-size:.8rem;color:var(--mut)}
  .chip.sel{border-color:var(--accentV);background:rgba(18,179,163,.09)}
  .chip.sel .n{background:var(--accentV);border-color:var(--accentV);color:#fff}
  .chip.dim{opacity:.45}
  .chip span.t{flex:1;min-width:0}
  .counter{font-size:1.3rem;font-weight:800;color:var(--accentV)}
  /* sliders (rating) */
  .rate{margin:14px 0;padding:12px 14px;background:#f7f9fe;border:1px solid var(--line);border-radius:14px}
  .rate .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .rate .val{font-weight:800;font-size:1.3rem;min-width:2.2ch;text-align:right;color:var(--A)}
  .rangeB .rate .val,.rate.rangeB .val{color:var(--B)}
  input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:999px;
    background:linear-gradient(90deg,var(--A),#8fb3ff);outline:none;padding:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
    background:#fff;border:3px solid var(--A);box-shadow:0 3px 10px rgba(31,49,102,.25);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;
    border:3px solid var(--A);cursor:pointer}
  .rangeB input[type=range]{background:linear-gradient(90deg,var(--B),#ff9fb1)}
  .rangeB input[type=range]::-webkit-slider-thumb{border-color:var(--B)}
  .rangeB input[type=range]::-moz-range-thumb{border-color:var(--B)}
  /* presenter big */
  .present h1{font-size:1.7rem;color:var(--ink)}
  .kicker{font-size:.82rem;color:var(--mut);font-weight:600;letter-spacing:.02em}
  .join{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center}
  .qrbox{background:#fff;padding:16px;border-radius:16px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(31,49,102,.1)}
  .qrbox img,.qrbox canvas,.qrbox table,.qrbox svg{display:block;width:min(46vw,320px);height:auto}
  .url{font-size:1.4rem;font-weight:800;letter-spacing:.2px;word-break:break-all;color:var(--A)}
  .code{font-size:2.6rem;font-weight:900;letter-spacing:2px;color:var(--accentV)}
  .bars{margin-top:6px}
  .bar{display:flex;align-items:center;gap:12px;margin:7px 0}
  .bar .lbl{width:40%;text-align:right;color:var(--mut);font-weight:600;font-size:.95rem}
  .bar .track{flex:1;background:#eef2f9;border-radius:999px;height:26px;overflow:hidden;border:1px solid var(--line)}
  .bar .fill{height:100%;background:linear-gradient(90deg,#2f6bff,#7aa2ff);border-radius:999px;
    transition:width .5s cubic-bezier(.2,.8,.2,1);min-width:2px}
  .bar.win .lbl{color:var(--txt)}
  .bar.win .fill{background:linear-gradient(90deg,#12b3a3,#18b866)}
  .bar .cnt{width:44px;font-weight:800;color:var(--txt)}
  .legend{display:flex;gap:20px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .legend .k{display:flex;align-items:center;gap:8px;font-weight:700}
  .sw{width:16px;height:16px;border-radius:5px}
  .radar-grid{display:flex;justify-content:center}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
    border-radius:12px;padding:12px 18px;font-weight:700;opacity:0;
    transition:opacity .25s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(20,26,51,.3)}
  .toast.show{opacity:1}
  .banner{background:linear-gradient(90deg,rgba(18,179,163,.1),rgba(47,107,255,.06));border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--mut)}
  .center{text-align:center}
  .big-emoji{font-size:3rem}
  @media(max-width:560px){ .chip{flex:1 1 100%} .bar .lbl{width:36%} }
  .hidden{display:none!important}
  a.link{color:var(--A)}
  .steps{display:flex;gap:6px;margin:2px 0 4px}
  .steps .s{flex:1;height:6px;border-radius:999px;background:#e4e9f4}
  .steps .s.on{background:var(--accentV)}
  .kpi{font-size:2.4rem;font-weight:900;line-height:1;color:var(--ink);font-family:"Poppins",sans-serif}
</style>
</head>

var qrcode = function() {

   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;

    var _dataList = [];

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {

        } else {
          _modules[8][15 - i - 1] = mod;
        }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;

            break;

      var maxEcCount = 0;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      for (var i = 0; i < rsBlocks.length; i += 1) {

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8

        buffer.put(0, 4);

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

      // padding

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);

        break;

      _dataCache = null;

    _this.getModuleCount = function() {

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {

    _this.createTableTag = function(cellSize, margin) {

      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';

// ---------- utilidades ----------
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...kids)=>{const e=document.createElement(t);
  for(const k in a){ if(k==="class")e.className=a[k]; else if(k==="html")e.innerHTML=a[k];

    else if(a[k]!=null)e.setAttribute(k,a[k]); }
  for(const c of kids){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(c)); }

/* =====================================================================
   STORE  —  dos implementaciones con la misma interfaz
   state: {stage, meta:{title,variables,scaleMin,scaleMax,labelA,labelB}, top8:[...]}
   votes: {presence:{cid:ts}, select:{cid:[..]}, rateA:{cid:{i:v}}, rateB:{cid:{i:v}}}
   ===================================================================== */
function makeFirebaseStore(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  const root = db.ref("sessions/"+SESSION);
  const api = {
    demo:false,
    onState(cb){ root.child("state").on("value",s=>cb(s.val()||null)); },
    onVotes(cb){ root.child("votes").on("value",s=>cb(s.val()||{})); },
    setState(patch){ return root.child("state").update(patch); },
    setStateFull(st){ return root.child("state").set(st); },
    submitSelect(arr){ return root.child("votes/select/"+CLIENT).set(arr); },
    submitRate(round,obj,key){ return root.child("votes/"+round+"/"+(key||CLIENT)).set(obj); },
    heartbeat(){ const r=root.child("votes/presence/"+CLIENT); r.set(Date.now());
      r.onDisconnect().remove(); },
    resetVotes(){ return root.child("votes").remove(); }
  };
  return api;
}

function makeDemoStore(){
  // estado en memoria + votantes simulados
  let state=null, votes={presence:{},select:{},rateA:{},rateB:{}};
  let stateCbs=[], voteCbs=[];
  const emitS=()=>stateCbs.forEach(f=>f(state));
  const emitV=()=>voteCbs.forEach(f=>f(JSON.parse(JSON.stringify(votes))));
  const N=26; const fake=[...Array(N)].map((_,i)=>"bot"+i);
  let simTimer=null;
  function stopSim(){ if(simTimer){clearInterval(simTimer);simTimer=null;} }
  function weights(n){ // pesos para que unas variables ganen
    const w=[...Array(n)].map((_,i)=>1+Math.abs(Math.sin(i*1.7))*4+ (i%3===0?2:0)); return w; }
  function pickWeighted(vars,k){
    const w=weights(vars.length); const idx=[...vars.keys()]; const out=[];
    const ww=w.slice();
    for(let c=0;c<k;c++){ let sum=idx.reduce((a,i)=>a+ww[i],0),r=Math.random()*sum,acc=0,ch=idx[0];
      for(const i of idx){acc+=ww[i]; if(r<=acc){ch=i;break;}}
      out.push(ch); ww[ch]=0; }
    return out.sort((a,b)=>a-b);
  }
  function simSelect(){ stopSim(); votes.select={}; emitV();
    let i=0; simTimer=setInterval(()=>{ if(i>=N||!state||state.stage!=="select"){stopSim();return;}
      const cid=fake[i++]; votes.presence[cid]=Date.now();
      votes.select[cid]=pickWeighted(state.meta.variables,state.meta?state.top8?state.top8.length:CONFIG.pick:CONFIG.pick);
      emitV(); },140); }
  function simRate(round,cnt){ stopSim(); votes[round]={}; emitV();
    const top=state.top8||[]; let i=0; const total=cnt||N; const mid=(CONFIG.scaleMin+CONFIG.scaleMax)/2;
    simTimer=setInterval(()=>{ if(i>=total||!state||state.stage!==round){stopSim();return;}
      const voter=fake[i]; const key = round==="rateB" ? String(i+1) : voter; i++;
      votes.presence[voter]=Date.now(); const o={};
      top.forEach((vi,k)=>{ let base;
        if(round==="rateA"){ base = mid + Math.sin(k*1.3)*1.6; }             // promedio individual suave
        else { base = mid + Math.sin((k + i*1.9)*0.85)*2.1; }               // cada grupo con forma distinta
        o[vi]=clamp(Math.round(base+(Math.random()*1.4-0.7)),CONFIG.scaleMin,CONFIG.scaleMax); });
      votes[round][key]=o; emitV(); }, round==="rateB"?320:150); }
  const api={
    demo:true,
    onState(cb){ stateCbs.push(cb); cb(state); },
    onVotes(cb){ voteCbs.push(cb); cb(votes); },
    setState(patch){ state=Object.assign({},state,patch); emitS();
      if(patch.stage==="select") simSelect();
      if(patch.stage==="rateA") simRate("rateA");
      if(patch.stage==="rateB") simRate("rateB",3);
      if(patch.stage==="reveal"||patch.stage==="overlay"||patch.stage==="lobby") stopSim();
      return Promise.resolve(); },
    setStateFull(st){ state=st; emitS(); return Promise.resolve(); },
    submitSelect(arr){ votes.select[CLIENT]=arr; votes.presence[CLIENT]=Date.now(); emitV(); return Promise.resolve(); },
    submitRate(round,obj,key){ votes[round][key||CLIENT]=obj; votes.presence[CLIENT]=Date.now(); emitV(); return Promise.resolve(); },
    heartbeat(){ votes.presence[CLIENT]=Date.now(); emitV(); },
    resetVotes(){ votes={presence:{},select:{},rateA:{},rateB:{}}; emitV(); return Promise.resolve(); }
  };
  return api;
}

/* =====================================================================
   AGREGACIONES
   ===================================================================== */
function tallySelect(votes){ // -> array de conteos por variable
  const sel=votes.select||{}; const counts={};
  Object.values(sel).forEach(arr=>{ (arr||[]).forEach(i=>counts[i]=(counts[i]||0)+1); });
  return counts;
}
function top8From(counts,n){ // índices ordenados desc por conteo, desempate por índice
  return Object.keys(counts).map(Number).sort((a,b)=> (counts[b]-counts[a])||(a-b) ).slice(0,n);
}
function radarAverages(votes,round,top8){ // -> {avg:[...], count}
  const r=votes[round]||{}; const ids=Object.keys(r);
  const sums=top8.map(()=>0), cnts=top8.map(()=>0);
  ids.forEach(cid=>{ const o=r[cid]||{}; top8.forEach((vi,k)=>{ if(o[vi]!=null){sums[k]+=o[vi];cnts[k]++;} }); });
  return { avg: top8.map((_,k)=> cnts[k]? sums[k]/cnts[k] : 0 ), count: ids.length };
}
function presenceCount(votes){ const p=votes.presence||{}; const now=Date.now();
  return Object.values(p).filter(ts=> now-ts < 60000 ).length; }
// Ronda B: cada grupo es su propia figura (NO se promedia). Claves = nº de grupo ("1".."4").
function rateSubmissions(votes,round,top8,cap){
  const r=votes[round]||{};
  let keys=Object.keys(r).filter(k=>r[k]);                 // filtra huecos de arrays de Firebase
  keys.sort((a,b)=> (!isNaN(a)&&!isNaN(b))? (+a-+b) : (a<b?-1:1) );
  const shown=keys.slice(0,cap||B_MAX);
  return { total: keys.length,
    series: shown.map(k=>({ key:k, label:"Grupo "+k,
      gi: (!isNaN(k)? (+k-1) : 0) % GROUPCOL.length,        // color estable por nº de grupo
      avg: top8.map(vi=> (r[k]&&r[k][vi]!=null)? r[k][vi] : 0 ) })) };
}

/* =====================================================================
   RADAR SVG
   ===================================================================== */
function radarSVG(labels, series, opt={}){
  // series: [{avg:[...], color, fill, name}], escala scaleMin..scaleMax
  const size=opt.size||460;
  const W=size*1.55, H=size, cx=W/2, cy=H/2, R=size*0.30;
  const n=labels.length, min=CONFIG.scaleMin, max=CONFIG.scaleMax;
  const ang=i=> (-Math.PI/2) + i*2*Math.PI/n;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width", opt.px||W); svg.style.maxWidth="94vw"; svg.style.height="auto";
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  // anillos
  const rings=opt.rings||5;
  for(let g=1;g<=rings;g++){ const rr=R*g/rings; let d="";
    for(let i=0;i<n;i++){const[x,y]=pt(i,rr); d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";}
    d+="Z"; svg.append(mk("path",{d,fill:(g%2? "rgba(47,107,255,.03)":"none"),stroke:"#dbe3f2","stroke-width":1})); }
  // ejes + etiquetas
  for(let i=0;i<n;i++){ const[x,y]=pt(i,R);
    svg.append(mk("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:"#dbe3f2","stroke-width":1}));
    const[lx,ly]=pt(i,R+20);
    const anchor = Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end");
    const t=mk("text",{x:lx,y:ly,fill:"#39456f","font-size":opt.fontSize||14,
      "text-anchor":anchor,"dominant-baseline":"middle","font-weight":"600"});
    // recorta etiquetas largas en dos líneas
    const WRAP=14;
    const words=String(labels[i]).split(" ");
    const lines=[]; let cur="";
    for(const w of words){ if(cur && (cur+" "+w).length>WRAP){ lines.push(cur); cur=w; } else cur=cur?cur+" "+w:w; }
    if(cur) lines.push(cur);
    const lh=1.15, startDy=-((lines.length-1)/2)*lh;
    lines.forEach((ln,li)=>{ const s=mk("tspan",{x:lx,dy:(li===0?startDy:lh)+"em"}); s.textContent=ln; t.append(s); });
    svg.append(t);
  }
  // series
  series.forEach(s=>{ let d="";
    s.avg.forEach((v,i)=>{ const r=R*clamp((v-min)/(max-min),0,1); const[x,y]=pt(i,r);
      d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; });
    d+="Z";
    svg.append(mk("path",{d,fill:s.fill,stroke:s.color,"stroke-width":3,"stroke-linejoin":"round"}));
    s.avg.forEach((v,i)=>{ const r=R*clamp((v-min)/(max-min),0,1); const[x,y]=pt(i,r);
      svg.append(mk("circle",{cx:x,cy:y,r:4.5,fill:s.color,stroke:"#ffffff","stroke-width":1.5})); });
  });
  return svg;
}

/* =====================================================================
   QR  (usa librería CDN; si no carga, muestra la URL grande)
   ===================================================================== */
function renderQR(container, text){
  container.innerHTML="";
  try{
    const qr=qrcode(0,"M"); qr.addData(text); qr.make();
    container.innerHTML=qr.createSvgTag({cellSize:6,margin:2,scalable:true});
    const svg=container.querySelector("svg");
    if(svg){ svg.removeAttribute("width"); svg.removeAttribute("height");
      svg.style.width="min(46vw,320px)"; svg.style.height="auto"; svg.style.display="block"; }
  }catch(e){
    container.innerHTML='<div class="url" style="color:#111">'+text+'</div>';
  }
}

   APP
   ===================================================================== */
let STORE=null, STATE=null, VOTES={};

function boot(){
  if(USE_DEMO){ STORE=makeDemoStore(); start(); }
  else{
    // cargar SDK de firebase compat dinámicamente
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js")
      .then(()=>loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"))
      .then(()=>{ STORE=makeFirebaseStore(); start(); })
      .catch(()=>{ toast("No se pudo conectar; usando modo demo"); STORE=makeDemoStore(); start(); });
  }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");
  s.src=src;s.onload=res;s.onerror=rej;document.head.append(s);});}

function start(){
  STORE.onState(s=>{ STATE=s; render(); });
  STORE.onVotes(v=>{ VOTES=v||{}; render(); });
  // heartbeat de presencia
  STORE.heartbeat();
  setInterval(()=>STORE.heartbeat(), 20000);
  if(IS_PRESENT && !STATE){ /* presentador arranca en setup */ renderPresenter(); }
  // vista previa de pantallas del participante:  ?preview=select|rateA|rateB   (solo en demo)
  const pv=qparam("preview");
  if(USE_DEMO && !IS_PRESENT && pv){
    STATE={stage:pv, meta:{title:CONFIG.title,variables:DEFAULT_VARIABLES,
      scaleMin:CONFIG.scaleMin,scaleMax:CONFIG.scaleMax,labelA:CONFIG.labelA,labelB:CONFIG.labelB},
      top8:[0,1,2,3,4,5,6,7]};
  }
  render();
}

let _lastKey="";
function render(){
  const key = JSON.stringify([IS_PRESENT, STATE&&STATE.stage, STATE&&STATE.top8,
    Object.keys(VOTES.presence||{}).length,
    Object.keys(VOTES.select||{}).length,
    Object.keys(VOTES.rateA||{}).length,
    Object.keys(VOTES.rateB||{}).length ]);
  // el participante re-renderiza solo al cambiar etapa (para no perder su input)
  if(IS_PRESENT) renderPresenter();
  else renderParticipant();
}

/* ---------------- PRESENTADOR ---------------- */
let _presSetupShown=false;
function renderPresenter(){
  app.className="wrap present";
  const stage = STATE ? STATE.stage : "setup";
  if(stage==="setup"||!STATE){ if(_presSetupShown) return; _presSetupShown=true; return presenterSetup(); }
  _presSetupShown=false;
  const meta=STATE.meta, top8=STATE.top8||[];
  const connected = presenceCount(VOTES);
  const header = el("div",{class:"row"},
    el("div",{}, brandBar(), el("div",{class:"kicker",style:"margin-top:6px"}, meta.title||CONFIG.title)),
    el("div",{class:"spacer"}),
    el("div",{class:"pill"}, el("span",{class:"dot"+(STORE.demo?" off":"")}), STORE.demo?"DEMO":"EN VIVO"),
    el("div",{class:"pill"}, "👥 ", String(connected), " conectados"),
    el("button",{class:"ghost",style:"padding:8px 12px",title:"Empezar de cero",
      onclick:()=>{ if(confirm("¿Empezar de cero? Se borran los votos actuales.")){ STORE.resetVotes(); STORE.setStateFull({stage:"setup"}); } }},"↺")
  );
  const steps = el("div",{class:"steps"});
  ["lobby","select","rateA","rateB","overlay"].forEach(s=>{
    const on = STAGES.indexOf(stage)>=STAGES.indexOf(s) || (stage==="reveal"&&s==="select");
    steps.append(el("div",{class:"s"+(on?" on":"")})); });

  app.innerHTML=""; app.append(header, steps);

  if(stage==="lobby") presenterLobby(top8,connected);
  else if(stage==="select") presenterSelect();
  else if(stage==="reveal") presenterReveal();
  else if(stage==="rateA") presenterRate("rateA");
  else if(stage==="rateB") presenterRate("rateB");
  else if(stage==="overlay") presenterOverlay();
  app.append(footer());
}

  app.className="wrap present"; app.innerHTML="";

      : "Conectado a Firebase — modo EN VIVO."),

          scaleMin:CONFIG.scaleMin,scaleMax:CONFIG.scaleMax,labelA:CONFIG.labelA,labelB:CONFIG.labelB};

        STORE.setStateFull({stage:"lobby",meta,top8:null});

function presenterLobby(top8,connected){
  const qr=el("div",{class:"qrbox"});
  const card=el("div",{class:"card center"},
    el("h2",{},"Escanea para participar"),
    el("div",{class:"join"},
      qr,
      el("div",{},
        el("div",{class:"mut"},"o entra a"),
        el("div",{class:"url"},participantURL().replace(/^https?:\/\//,"")),
        el("div",{style:"height:16px"}),
        el("div",{class:"kpi"},String(connected)),
        el("div",{class:"mut"},"conectados")
      )
    ),
    el("div",{style:"height:18px"}),
    el("button",{class:"big",onclick:()=>STORE.setState({stage:"select"})},
      "Comenzar priorización  (elegir "+CONFIG.pick+" de "+STATE.meta.variables.length+")")
  );

  renderQR(qr, participantURL());

function presenterSelect(){
  const counts=tallySelect(VOTES);
  const submitted=Object.keys(VOTES.select||{}).length;
  const provisional = top8From(counts, CONFIG.pick);
  const vars=STATE.meta.variables;
  const maxc=Math.max(1,...Object.values(counts),1);
  const bars=el("div",{class:"bars"});
  // orden por conteo desc
  const order=[...vars.keys()].sort((a,b)=>((counts[b]||0)-(counts[a]||0))||(a-b));
  order.forEach(i=>{ const c=counts[i]||0; const win=provisional.includes(i);
    bars.append(el("div",{class:"bar"+(win?" win":"")},
      el("div",{class:"lbl"},vars[i]),
      el("div",{class:"track"}, el("div",{class:"fill",style:"width:"+(c/maxc*100)+"%"})),
      el("div",{class:"cnt"},String(c))
    )); });
  const card=el("div",{class:"card"},
    el("div",{class:"row"}, el("h2",{},"Priorización en vivo"),
      el("div",{class:"spacer"}),
      el("div",{class:"pill"},"✅ ",String(submitted)," respuestas")),
    el("div",{class:"mut"},"Las 8 con más votos (verde) quedarán seleccionadas."),
    bars,
    el("div",{class:"row",style:"margin-top:12px"},
      el("button",{class:"big",onclick:()=>{
        const t8=top8From(tallySelect(VOTES),CONFIG.pick);
        if(t8.length<CONFIG.pick){ toast("Aún faltan votos para "+CONFIG.pick+" variables"); return; }
        STORE.setState({stage:"reveal",top8:t8});
      }},"Cerrar y fijar top "+CONFIG.pick+" →"),
      el("button",{class:"ghost",onclick:()=>STORE.setState({stage:"lobby"})},"◂ Volver")
    )
  );
  app.append(card);
}

function presenterReveal(){
  const vars=STATE.meta.variables, top8=STATE.top8||[];
  const list=el("div",{class:"chips"});
  top8.forEach((i,k)=>list.append(el("div",{class:"chip sel"},
    el("div",{class:"n"},String(k+1)), el("span",{class:"t"},vars[i]))));
  const card=el("div",{class:"card center"},
    el("h2",{},"Las "+CONFIG.pick+" variables seleccionadas"),
    list,
    el("div",{style:"height:16px"}),
    el("button",{class:"big",onclick:()=>STORE.setState({stage:"rateA"})},
      "Iniciar Ronda A — "+STATE.meta.labelA+" →"),
    " ",
    el("button",{class:"ghost",onclick:()=>STORE.setState({stage:"select"})},"◂ Volver a priorización")
  );
  app.append(card);
}

function legendRow(items){
  const lg=el("div",{class:"legend"});
  items.forEach(it=> lg.append(el("div",{class:"k"},
    el("div",{class:"sw",style:"background:"+it.color}), it.label)));
  return lg;
}

function presenterRate(round){
  const vars=STATE.meta.variables, top8=STATE.top8||[];
  const labels=top8.map(i=>vars[i]);
  const isA = round==="rateA";
  let series, legendItems, countTxt, note=null;
  if(isA){
    const {avg,count}=radarAverages(VOTES,round,top8);
    series=[{avg,color:COL.A,fill:COL.Afill}];
    legendItems=[{color:COL.A,label:STATE.meta.labelA}];
    countTxt=count+" respuestas · promedio";
  } else {
    const {total,series:subs}=rateSubmissions(VOTES,round,top8,B_MAX);
    series=subs.map(s=>({avg:s.avg,color:GROUPCOL[s.gi].c,fill:GROUPCOL[s.gi].f}));
    legendItems=subs.map(s=>({color:GROUPCOL[s.gi].c,label:s.label}));
    countTxt = total+" "+(total===1?"grupo":"grupos");
    if(total>B_MAX) note="Mostrando las primeras "+B_MAX+" de "+total+" (superpuestas, sin promediar).";
  }
  const svg=radarSVG(labels,series,{px:760,size:560,fontSize:15});
  const card=el("div",{class:"card center"},
    el("div",{class:"row"},
      el("h2",{}, isA?"Ronda A · "+STATE.meta.labelA : "Ronda B · "+STATE.meta.labelB),
      el("div",{class:"spacer"}),
      el("div",{class:"pill"},"✍️ ",countTxt)),
    isA? null : el("div",{class:"mut",style:"margin:-2px 0 8px"},"Cada grupo es una figura propia — no se promedian (hasta "+(CONFIG.groups||B_MAX)+")."),
    el("div",{class:"radar-grid"},svg),
    legendItems.length? legendRow(legendItems) : el("div",{class:"mut"},"Esperando envíos…"),
    note? el("div",{class:"mut",style:"margin-top:6px;font-size:.85rem"},note) : null,
    el("div",{style:"height:10px"}),
    isA
      ? el("button",{class:"big",onclick:()=>STORE.setState({stage:"rateB"})},
          "Iniciar Ronda B — "+STATE.meta.labelB+" →")
      : el("button",{class:"big",onclick:()=>STORE.setState({stage:"overlay"})},
          "Ver radar superpuesto →"),
    " ",
    el("button",{class:"ghost",onclick:()=>STORE.setState({stage: isA?"reveal":"rateA"})},"◂ Volver")
  );
  app.append(card);
}

function presenterOverlay(){
  const vars=STATE.meta.variables, top8=STATE.top8||[];
  const labels=top8.map(i=>vars[i]);
  const A=radarAverages(VOTES,"rateA",top8).avg;
  const {series:subs}=rateSubmissions(VOTES,"rateB",top8,B_MAX);
  const series=[{avg:A,color:COL.A,fill:COL.Afill}]
    .concat(subs.map(s=>({avg:s.avg,color:GROUPCOL[s.gi].c,fill:"none"})));
  const svg=radarSVG(labels,series,{px:860,size:560,fontSize:15});
  const legendItems=[{color:COL.A,label:STATE.meta.labelA+" · promedio"}]
    .concat(subs.map(s=>({color:GROUPCOL[s.gi].c,label:s.label+" · "+STATE.meta.labelB})));
  const card=el("div",{class:"card center"},
    el("h2",{},"Radar superpuesto"),
    el("div",{class:"mut",style:"margin:-2px 0 8px"},STATE.meta.labelA+" (promedio) vs. los grupos de "+STATE.meta.labelB),
    el("div",{class:"radar-grid"},svg),
    legendRow(legendItems),
    el("div",{style:"height:12px"}),
    el("div",{class:"row",style:"justify-content:center"},
      el("button",{class:"ghost",onclick:()=>STORE.setState({stage:"rateB"})},"◂ Volver a Ronda B"),
      el("button",{class:"ghost",onclick:()=>{ if(confirm("¿Reiniciar toda la sesión?")){STORE.resetVotes();STORE.setStateFull({stage:"setup"});} }},"↺ Nueva sesión")
    )
  );
  app.append(card);
}

function presenterFooterNote(){
  return el("div",{class:"mut center",style:"margin-top:10px;font-size:.85rem"},
    "Pantalla de presentador. Los participantes abren el enlace normal (sin ?role).");
}

/* ---------------- PARTICIPANTE ---------------- */
let _partStageShown=null;
function renderParticipant(){
  app.className="wrap";
  const stage = STATE ? STATE.stage : "wait";
  // no re-pintar si ya estoy en la misma etapa (para no perder sliders/selección)
  if(_partStageShown===stage && ["select","rateA","rateB"].includes(stage)) { updateParticipantMeta(); return; }
  _partStageShown=stage;
  app.innerHTML="";
  const badge=el("div",{class:"topbar",style:"margin-bottom:12px"},
    brandBar(), el("div",{class:"spacer"}),
    el("div",{class:"pill"}, el("span",{class:"dot"+(STORE.demo?" off":"")}), STORE.demo?"DEMO":"Conectado"));
  app.append(badge);

  if(!STATE || stage==="setup" || stage==="lobby") partWait();
  else if(stage==="select") partSelect();
  else if(stage==="reveal") partMsg("👀","Mira la pantalla","Se están revelando las "+CONFIG.pick+" variables.");
  else if(stage==="rateA") partRate("rateA");
  else if(stage==="rateB") partRate("rateB");
  else if(stage==="overlay") partMsg("🎉","¡Gracias!","Mira el radar superpuesto en la pantalla.");
  app.append(footer());
}
function updateParticipantMeta(){}

function partWait(){
  app.append(el("div",{class:"card center"},
    el("div",{class:"big-emoji"},"⏳"),
    el("h2",{},"Ya estás dentro"),
    el("div",{class:"mut"},"Espera a que el presentador comience.")
  ));
}
function partMsg(emoji,title,sub){
  app.append(el("div",{class:"card center"},
    el("div",{class:"big-emoji"},emoji), el("h2",{},title), el("div",{class:"mut"},sub)));
}

function partSelect(){
  const vars=STATE.meta.variables, need=CONFIG.pick;
  const prev = (VOTES.select&&VOTES.select[CLIENT])||[];
  let chosen=new Set(prev);
  const counter=el("span",{class:"counter"},chosen.size+" / "+need);
  const chips=el("div",{class:"chips"});
  const submitBtn=el("button",{class:"big",onclick:()=>{
    if(chosen.size!==need){toast("Elige exactamente "+need);return;}
    STORE.submitSelect([...chosen].sort((a,b)=>a-b));
    toast("¡Enviado!"); done.classList.remove("hidden");
  }},"Enviar mis "+need);
  function refresh(){ counter.textContent=chosen.size+" / "+need;
    submitBtn.disabled = chosen.size!==need;
    [...chips.children].forEach((c,i)=>{ const sel=chosen.has(i);
      c.classList.toggle("sel",sel);
      c.classList.toggle("dim", !sel && chosen.size>=need); }); }
  vars.forEach((v,i)=>{ const chip=el("div",{class:"chip",onclick:()=>{
      if(chosen.has(i))chosen.delete(i); else{ if(chosen.size>=need){toast("Ya elegiste "+need);return;} chosen.add(i); }
      refresh(); }},
    el("div",{class:"n"}), el("span",{class:"t"},v)); chips.append(chip); });
  const done=el("div",{class:"banner hidden",style:"margin-top:10px"},"✔ Recibido. Puedes cambiar tu selección hasta que cierre la ronda.");
  app.append(el("div",{class:"card"},
    el("div",{class:"row"},el("h2",{},"Elige las "+need+" más importantes"),el("div",{class:"spacer"}),counter),
    el("div",{class:"mut"},"Toca para seleccionar."),
    chips, el("div",{style:"height:14px"}), submitBtn, done ));
  refresh();
}

function partRate(round){
  const vars=STATE.meta.variables, top8=STATE.top8||[];
  const isA=round==="rateA";
  const label=isA?STATE.meta.labelA:STATE.meta.labelB;
  const min=CONFIG.scaleMin,max=CONFIG.scaleMax, midv=Math.round((min+max)/2);
  const prev= isA ? ((VOTES[round]&&VOTES[round][CLIENT])||{}) : {};
  const vals={}; top8.forEach(vi=> vals[vi]= prev[vi]!=null?prev[vi]:midv);

  // selector de grupo (solo Ronda B): garantiza figuras separadas por grupo
  let group = isA ? null : (localStorage.getItem("radar_groupB")||null);
  const groupWrap = el("div",{class:"chips",style:"margin:8px 0 4px"});
  const gBtns=[];
  if(!isA){
    for(let g=1; g<=(CONFIG.groups||4); g++){
      const gb=el("div",{class:"chip"+(String(g)===group?" sel":""),
        style:"justify-content:center;flex:1 1 40%",
        onclick:()=>{ group=String(g); localStorage.setItem("radar_groupB",group);
          gBtns.forEach((b,bi)=> b.classList.toggle("sel", String(bi+1)===group)); }},
        el("span",{class:"t",style:"text-align:center"},"Grupo "+g));
      gBtns.push(gb); groupWrap.append(gb);
    }
  }

  const list=el("div",{});
  top8.forEach((vi)=>{ const valEl=el("div",{class:"val"},String(vals[vi]));
    const rng=el("input",{type:"range",min:String(min),max:String(max),step:"1",value:String(vals[vi]),
      oninput:e=>{ vals[vi]=+e.target.value; valEl.textContent=e.target.value; }});
    list.append(el("div",{class:"rate"+(isA?"":" rangeB")},
      el("div",{class:"top"}, el("div",{style:"font-weight:700"},vars[vi]), valEl), rng)); });

  const done=el("div",{class:"banner hidden",style:"margin-top:10px"},"✔ Recibido. Puedes ajustar y reenviar hasta que cierre la ronda.");
  const btn=el("button",{class:"big",style: isA?"":"background:var(--B)",onclick:()=>{
    if(!isA && !group){ toast("Primero elige tu grupo"); return; }
    STORE.submitRate(round,vals, isA? null : group);
    toast(isA?"¡Enviado!":"¡Enviado como Grupo "+group+"!"); done.classList.remove("hidden");
  }},"Enviar puntuaciones");

  app.append(el("div",{class:"card"},
    el("h2",{}, isA?"Ronda A":"Ronda B"),
    el("h3",{style:"margin:6px 0 0;color:"+(isA?"var(--A)":"var(--B)")}, label),
    el("div",{class:"banner",style:"margin-top:8px"}, "Puntúa cada variable de "+min+" a "+max+"."),
    !isA? el("div",{class:"mut",style:"margin-top:12px;font-weight:700;color:var(--txt)"},"¿Qué grupo eres?") : null,
    !isA? groupWrap : null,
    !isA? el("div",{style:"height:6px"}) : null,
    list, btn, done ));
}

boot();
})();
</script>
</body>
</html>
